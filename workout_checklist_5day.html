<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#c0392b">
<title>5-Day Workout Checklist</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; padding:0 0 3rem; background:#f7f7f5; color:#1a1a1a;
    font-family:-apple-system, Roboto, Helvetica, Arial, sans-serif; font-size:18px; line-height:1.45; }
  .app { max-width:640px; margin:0 auto; padding:12px; }
  h1 { font-size:22px; text-align:center; margin:4px 0 10px; }
  .sticky { position:sticky; top:0; background:#f7f7f5; padding:6px 0; z-index:5; margin-bottom:8px; }
  .who { display:flex; gap:8px; margin-bottom:8px; }
  .whobtn { flex:1; min-height:48px; border-radius:10px; border:2px solid #1a1a1a; background:#fff; font-size:17px; font-weight:700; color:#1a1a1a; }
  .whobtn.active { background:#1a1a1a; color:#fff; }
  .tabs { display:flex; gap:6px; }
  .tab { flex:1; min-height:52px; border-radius:10px; border:1px solid #bbb; background:#fff; font-size:15px; font-weight:700; padding:4px 2px; color:#333; }
  .tab small { display:block; font-weight:400; font-size:12px; color:#666; }
  .tab.active { background:#c0392b; border-color:#c0392b; color:#fff; }
  .tab.active small { color:#fbe3df; }
  .card { background:#fff; border:1px solid #e2e2e2; border-radius:14px; overflow:hidden; margin-bottom:14px; }
  .card-header { padding:16px 18px; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .push .card-header { background:#fbeae7; } .lower .card-header { background:#e6f1fb; }
  .pull .card-header { background:#eeedfe; } .lower2 .card-header { background:#e1f5ee; }
  .arms .card-header { background:#fdf0dc; } .cardio .card-header { background:#e8f0e0; }
  .card-title { font-size:20px; font-weight:700; }
  .card-sub { font-size:14px; color:#555; margin-top:3px; }
  .reset-btn { font-size:14px; padding:10px 14px; border-radius:8px; border:1px solid #bbb; background:#fff; flex-shrink:0; }
  .row { padding:16px 18px; border-top:1px solid #eee; }
  .row.done { background:#f4f4f2; }
  .top { display:flex; gap:14px; align-items:flex-start; }
  .top input[type=checkbox] { width:34px; height:34px; flex-shrink:0; margin-top:2px; accent-color:#c0392b; }
  .slot { font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:#888; }
  .ex-name { font-size:19px; font-weight:700; margin-top:1px; }
  .row.done .ex-name { text-decoration:line-through; color:#777; }
  .sets { font-size:16px; margin-top:4px; color:#c0392b; font-weight:700; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip { border:1px solid #bbb; background:#fff; border-radius:999px; padding:9px 14px; font-size:14px; color:#222; text-align:left; }
  .chip.sel { background:#1a1a1a; color:#fff; border-color:#1a1a1a; }
  .mach { display:inline-block; font-size:10px; font-weight:700; letter-spacing:.05em; background:#2e7d32; color:#fff; border-radius:4px; padding:1px 5px; margin-left:6px; vertical-align:middle; }
  .hint { font-size:13px; color:#666; margin:0 2px 12px; }
  .reset-all { width:100%; padding:16px; font-size:17px; font-weight:700; border-radius:10px; border:1px solid #bbb; background:#fff; }
  .note { font-size:13px; color:#555; padding:12px 18px; border-top:1px solid #eee; background:#fafaf8; }
</style>
</head>
<body>
<div class="app">
  <h1>5-Day Workout Checklist</h1>
  <div class="sticky">
    <div id="who" class="who"></div>
    <div id="tabs" class="tabs"></div>
  </div>
  <div id="app"></div>
</div>
<script>
var DAYS = [{"id": "mon", "tab": "Mon", "title": "Monday - Upper Push", "focus": "Chest, shoulders, triceps", "cls": "push", "items": [{"slot": "Chest", "him": "4 x 6-8", "her": "3 x 8-10", "opts": [{"n": "Barbell bench press", "m": false}, {"n": "Machine chest press", "m": true}, {"n": "Dumbbell bench press", "m": false}, {"n": "Weighted push-ups", "m": false}], "herKeep": true}, {"slot": "Upper chest", "him": "3 x 8-10", "her": "3 x 10-12", "opts": [{"n": "Incline dumbbell press", "m": false}, {"n": "Incline machine press", "m": true}, {"n": "Smith machine incline press", "m": true}, {"n": "Low-to-high cable fly", "m": false}], "herKeep": true}, {"slot": "Shoulders", "him": "4 x 8-10", "her": "3 x 10-12", "opts": [{"n": "Seated dumbbell shoulder press", "m": false}, {"n": "Machine shoulder press", "m": true}, {"n": "Barbell overhead press", "m": false}, {"n": "Arnold press", "m": false}], "herKeep": true}, {"slot": "Chest isolation", "him": "3 x 12-15", "her": "3 x 12-15", "opts": [{"n": "Cable fly", "m": false}, {"n": "Pec deck machine", "m": true}, {"n": "Dumbbell fly", "m": false}, {"n": "Svend press", "m": false}], "herKeep": false}, {"slot": "Side delts", "him": "3 x 12-15", "her": "3 x 12-15", "opts": [{"n": "Dumbbell lateral raise", "m": false}, {"n": "Machine lateral raise", "m": true}, {"n": "Cable lateral raise", "m": false}, {"n": "Leaning lateral raise", "m": false}], "herKeep": false}, {"slot": "Triceps", "him": "3 x 10-12", "her": "3 x 12-15", "opts": [{"n": "Cable rope pushdown", "m": false}, {"n": "Seated dip machine", "m": true}, {"n": "Overhead dumbbell extension", "m": false}, {"n": "Skull crushers", "m": false}], "herKeep": true}]}, {"id": "tue", "tab": "Tue", "title": "Tuesday - Lower (Quads & Glutes)", "focus": "Quads, glutes, calves, core", "cls": "lower", "items": [{"slot": "Squat pattern", "him": "4 x 6-8", "her": "3 x 8-10", "opts": [{"n": "Barbell back squat", "m": false}, {"n": "Hack squat machine", "m": true}, {"n": "Leg press", "m": true}, {"n": "Front squat", "m": false}], "herKeep": true}, {"slot": "Single leg", "him": "3 x 8-10/leg", "her": "3 x 10-12/leg", "opts": [{"n": "Bulgarian split squat", "m": false}, {"n": "Smith machine split squat", "m": true}, {"n": "Walking lunges", "m": false}, {"n": "Step-ups", "m": false}], "herKeep": true}, {"slot": "Quad isolation", "him": "3 x 12-15", "her": "3 x 12-15", "opts": [{"n": "Leg extension machine", "m": true}, {"n": "Single-leg leg extension", "m": true}, {"n": "Sissy squat", "m": false}, {"n": "Banded terminal knee extension", "m": false}], "herKeep": false}, {"slot": "Glutes", "him": "4 x 8-10", "her": "3 x 10-12", "opts": [{"n": "Barbell hip thrust", "m": false}, {"n": "Hip thrust machine", "m": true}, {"n": "Smith machine hip thrust", "m": true}, {"n": "Cable pull-through", "m": false}], "herKeep": true}, {"slot": "Calves", "him": "4 x 12-15", "her": "3 x 15-20", "opts": [{"n": "Standing calf raise machine", "m": true}, {"n": "Seated calf raise machine", "m": true}, {"n": "Leg press calf raise", "m": true}, {"n": "Single-leg dumbbell calf raise", "m": false}], "herKeep": false}, {"slot": "Core", "him": "3 x 12-15", "her": "3 x 15-20", "opts": [{"n": "Cable crunch", "m": false}, {"n": "Ab crunch machine", "m": true}, {"n": "Hanging knee raise", "m": false}, {"n": "Ab wheel rollout", "m": false}], "herKeep": true}]}, {"id": "wed", "tab": "Wed", "title": "Wednesday - Upper Pull", "focus": "Back, rear delts, biceps", "cls": "pull", "items": [{"slot": "Vertical pull", "him": "4 x 6-10", "her": "3 x 6-10 (assisted ok)", "opts": [{"n": "Pull-ups", "m": false}, {"n": "Lat pulldown", "m": true}, {"n": "Assisted pull-up machine", "m": true}, {"n": "Chin-ups", "m": false}], "herKeep": true}, {"slot": "Horizontal pull", "him": "4 x 6-8", "her": "3 x 8-10", "opts": [{"n": "Barbell bent-over row", "m": false}, {"n": "Chest-supported row machine", "m": true}, {"n": "Seated cable row", "m": true}, {"n": "T-bar row", "m": false}], "herKeep": true}, {"slot": "Single arm", "him": "3 x 8-10/arm", "her": "3 x 10-12/arm", "opts": [{"n": "One-arm dumbbell row", "m": false}, {"n": "Machine high row", "m": true}, {"n": "Single-arm cable row", "m": false}, {"n": "Meadows row", "m": false}], "herKeep": false}, {"slot": "Lats", "him": "3 x 12-15", "her": "3 x 12-15", "opts": [{"n": "Straight-arm pulldown", "m": false}, {"n": "Machine pullover", "m": true}, {"n": "Dumbbell pullover", "m": false}, {"n": "Cable lat prayer", "m": false}], "herKeep": false}, {"slot": "Rear delts", "him": "3 x 12-15", "her": "3 x 15", "opts": [{"n": "Face pull", "m": false}, {"n": "Reverse pec deck machine", "m": true}, {"n": "Rear delt dumbbell fly", "m": false}, {"n": "Band pull-apart", "m": false}], "herKeep": true}, {"slot": "Biceps", "him": "3 x 8-10", "her": "3 x 10-12", "opts": [{"n": "Barbell curl", "m": false}, {"n": "Preacher curl machine", "m": true}, {"n": "Incline dumbbell curl", "m": false}, {"n": "Hammer curl", "m": false}], "herKeep": true}]}, {"id": "thu", "tab": "Thu", "title": "Thursday - Lower (Hamstrings & Glutes)", "focus": "Hamstrings, glutes, hips, calves", "cls": "lower2", "items": [{"slot": "Hip hinge", "him": "4 x 6-8", "her": "3 x 8-10", "opts": [{"n": "Romanian deadlift", "m": false}, {"n": "45-degree back extension machine", "m": true}, {"n": "Dumbbell Romanian deadlift", "m": false}, {"n": "Trap bar deadlift", "m": false}], "herKeep": true}, {"slot": "Hamstring curl", "him": "3 x 10-12", "her": "3 x 12-15", "opts": [{"n": "Lying leg curl machine", "m": true}, {"n": "Seated leg curl machine", "m": true}, {"n": "Nordic curl", "m": false}, {"n": "Stability ball leg curl", "m": false}], "herKeep": true}, {"slot": "Quad/glute press", "him": "4 x 8-12", "her": "3 x 10-12", "opts": [{"n": "Leg press (feet high)", "m": true}, {"n": "Smith machine sumo squat", "m": true}, {"n": "Goblet sumo squat", "m": false}, {"n": "Walking lunges", "m": false}], "herKeep": true}, {"slot": "Glute isolation", "him": "3 x 12-15/leg", "her": "3 x 12-15/leg", "opts": [{"n": "Cable glute kickback", "m": false}, {"n": "Glute kickback machine", "m": true}, {"n": "Cable pull-through", "m": false}, {"n": "Banded glute bridge", "m": false}], "herKeep": true}, {"slot": "Hips", "him": "3 x 12-15", "her": "3 x 15-20", "opts": [{"n": "Hip abduction machine", "m": true}, {"n": "Hip adduction machine", "m": true}, {"n": "Cable hip abduction", "m": false}, {"n": "Banded lateral walks", "m": false}], "herKeep": false}, {"slot": "Calves", "him": "4 x 12-15", "her": "3 x 15-20", "opts": [{"n": "Seated calf raise machine", "m": true}, {"n": "Standing calf raise machine", "m": true}, {"n": "Leg press calf raise", "m": true}, {"n": "Donkey calf raise", "m": false}], "herKeep": false}]}, {"id": "fri", "tab": "Fri", "title": "Friday - Upper (Shoulders & Arms)", "focus": "Shoulders, arms, upper back, chest", "cls": "arms", "items": [{"slot": "Overhead press", "him": "4 x 6-8", "her": "3 x 8-10", "opts": [{"n": "Standing barbell overhead press", "m": false}, {"n": "Machine shoulder press", "m": true}, {"n": "Seated dumbbell press", "m": false}, {"n": "Landmine press", "m": false}], "herKeep": true}, {"slot": "Upper back", "him": "3 x 10-12", "her": "3 x 10-12", "opts": [{"n": "Wide-grip seated cable row", "m": false}, {"n": "Wide-grip row machine", "m": true}, {"n": "Chest-supported dumbbell row", "m": false}, {"n": "Inverted row", "m": false}], "herKeep": true}, {"slot": "Chest/triceps", "him": "3 x 8-10", "her": "3 x 8-10 (assisted ok)", "opts": [{"n": "Weighted dips", "m": false}, {"n": "Assisted dip machine", "m": true}, {"n": "Close-grip bench press", "m": false}, {"n": "Decline push-ups", "m": false}], "herKeep": false}, {"slot": "Biceps", "him": "3 x 10-12", "her": "3 x 10-12", "opts": [{"n": "Dumbbell curl", "m": false}, {"n": "Preacher curl machine", "m": true}, {"n": "EZ-bar curl", "m": false}, {"n": "Cable curl", "m": false}], "herKeep": true}, {"slot": "Triceps", "him": "3 x 10-12", "her": "3 x 12-15", "opts": [{"n": "Overhead cable extension", "m": false}, {"n": "Triceps extension machine", "m": true}, {"n": "Skull crushers", "m": false}, {"n": "Overhead dumbbell extension", "m": false}], "herKeep": false}, {"slot": "Delts", "him": "3 x 12-15", "her": "3 x 12-15", "opts": [{"n": "Cable lateral raise", "m": false}, {"n": "Machine lateral raise", "m": true}, {"n": "Reverse pec deck machine", "m": true}, {"n": "Dumbbell lateral raise", "m": false}], "herKeep": true}]}, {"id": "cardio", "tab": "Cardio", "title": "Cardio", "focus": "", "cls": "cardio", "items": [{"slot": "Optional", "him": "15-20 min after lifting", "her": "", "opts": [{"n": "Incline walk (treadmill)", "m": false}, {"n": "Outdoor brisk walk", "m": false}, {"n": "Stair climber", "m": false}, {"n": "Elliptical", "m": false}], "herKeep": true}, {"slot": "Optional", "him": "15 min: 30 sec hard / 90 sec easy", "her": "", "opts": [{"n": "Treadmill intervals", "m": false}, {"n": "Outdoor hill repeats", "m": false}, {"n": "Rowing machine", "m": false}, {"n": "Stationary bike intervals", "m": false}], "herKeep": true}, {"slot": "Optional", "him": "20-25 min easy pace", "her": "", "opts": [{"n": "Treadmill run", "m": false}, {"n": "Outdoor run", "m": false}, {"n": "Stationary bike", "m": false}, {"n": "Easy outdoor walk", "m": false}], "herKeep": true}], "itemsHer": [{"slot": "Monday", "him": "", "her": "20 min - the one harder day (legs are fresh)", "opts": [{"n": "Intervals (treadmill): 1 min hard / 90 sec easy", "m": false}, {"n": "Outdoor intervals or hill repeats", "m": false}, {"n": "Incline walk (easier option)", "m": false}, {"n": "Stationary bike intervals", "m": false}], "herKeep": true}, {"slot": "Tuesday", "him": "", "her": "20 min easy - you can still talk", "opts": [{"n": "Incline walk (treadmill)", "m": false}, {"n": "Easy outdoor walk or jog", "m": false}, {"n": "Elliptical", "m": false}, {"n": "Stationary bike", "m": false}], "herKeep": true}, {"slot": "Wednesday", "him": "", "her": "20 min easy - you can still talk", "opts": [{"n": "Incline walk (treadmill)", "m": false}, {"n": "Easy outdoor walk or jog", "m": false}, {"n": "Elliptical", "m": false}, {"n": "Stationary bike", "m": false}], "herKeep": true}, {"slot": "Thursday", "him": "", "her": "20 min easy - you can still talk", "opts": [{"n": "Incline walk (treadmill)", "m": false}, {"n": "Easy outdoor walk or jog", "m": false}, {"n": "Elliptical", "m": false}, {"n": "Stationary bike", "m": false}], "herKeep": true}, {"slot": "Friday", "him": "", "her": "20 min easy - you can still talk", "opts": [{"n": "Incline walk (treadmill)", "m": false}, {"n": "Easy outdoor walk or jog", "m": false}, {"n": "Elliptical", "m": false}, {"n": "Stationary bike", "m": false}], "herKeep": true}]}];
var KEY = "workout5-v2";
var st = {who:"him", tab:null, him:{done:{},pick:{}}, her:{done:{},pick:{}}};

function load() {
  try { var r = localStorage.getItem(KEY); if (r) st = JSON.parse(r); } catch (e) {}
  if (!st.who) st.who = "him";
  if (!st.him) st.him = {done:{},pick:{}};
  if (!st.her) st.her = {done:{},pick:{}};
  if (!st.tab) {
    var d = new Date().getDay();
    st.tab = (d >= 1 && d <= 5) ? DAYS[d-1].id : DAYS[0].id;
  }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} }
function me() { return st[st.who]; }
function k(dayId, i) { return dayId + ":" + i; }
function dayById(id) { for (var i=0;i<DAYS.length;i++) if (DAYS[i].id===id) return DAYS[i]; return DAYS[0]; }

// Items this person sees, each with its original index (so saved checks stay stable)
function itemsFor(day) {
  var out = [], src = day.items, i;
  if (day.id === "cardio" && st.who === "her") src = day.itemsHer;
  for (i=0;i<src.length;i++) {
    if (st.who === "her" && day.id !== "cardio" && !src[i].herKeep) continue;
    out.push({it:src[i], idx:i});
  }
  return out;
}
function doneCount(day) {
  var list = itemsFor(day), n = 0;
  for (var i=0;i<list.length;i++) if (me().done[k(day.id, list[i].idx)]) n++;
  return n;
}

function setWho(w) { st.who = w; save(); render(); }
function setTab(id) { st.tab = id; save(); render(); window.scrollTo(0,0); }
function toggle(dayId, i, v) { var key=k(dayId,i); if (v) me().done[key]=true; else delete me().done[key]; save(); render(); }
function pick(dayId, i, o) { me().pick[k(dayId,i)] = o; save(); render(); }
function resetDay(dayId) {
  var day = dayById(dayId), list = itemsFor(day);
  for (var i=0;i<list.length;i++) { delete me().done[k(dayId,list[i].idx)]; delete me().pick[k(dayId,list[i].idx)]; }
  save(); render();
}
function resetAll() {
  if (!confirm("Clear all checkmarks and selected variations for " + (st.who==="her" ? "her" : "him") + " for the whole week?")) return;
  st[st.who] = {done:{},pick:{}}; save(); render();
}

function render() {
  document.getElementById("who").innerHTML =
    '<button class="whobtn' + (st.who==="him" ? ' active' : '') + '" onclick="setWho(\'him\')">Him</button>' +
    '<button class="whobtn' + (st.who==="her" ? ' active' : '') + '" onclick="setWho(\'her\')">Her</button>';

  var t = "";
  DAYS.forEach(function(d) {
    t += '<button class="tab' + (d.id===st.tab ? ' active' : '') + '" onclick="setTab(\'' + d.id + '\')">' +
         d.tab + '<small>' + doneCount(d) + '/' + itemsFor(d).length + '</small></button>';
  });
  document.getElementById("tabs").innerHTML = t;

  var day = dayById(st.tab), list = itemsFor(day), her = (st.who === "her");
  var title = day.title, sub = day.focus;
  if (day.id === "cardio") {
    title = her ? "Cardio - 20 min, Mon-Fri" : "Cardio - optional";
    sub = her ? "Easy pace after lifting" : "2-3 short sessions a week";
  } else if (her) {
    sub = day.focus + " (4 exercises)";
  }
  var h = '<div class="hint">Tap the box when done. Tap a variation to mark which one you used. <span class="mach">MACHINE</span> = machine option.</div>';
  h += '<div class="card ' + day.cls + '"><div class="card-header"><div><div class="card-title">' + title +
       '</div><div class="card-sub">' + sub + ' &bull; ' + doneCount(day) + ' of ' + list.length + ' done</div></div>' +
       '<button class="reset-btn" onclick="resetDay(\'' + day.id + '\')">Reset</button></div>';
  list.forEach(function(entry) {
    var it = entry.it, i = entry.idx, key = k(day.id, i);
    var done = !!me().done[key], sel = me().pick[key] || 0;
    var sets = her ? it.her : it.him;
    h += '<div class="row' + (done ? ' done' : '') + '"><div class="top">' +
         '<input type="checkbox" ' + (done ? 'checked' : '') + ' onchange="toggle(\'' + day.id + '\',' + i + ',this.checked)">' +
         '<div><div class="slot">' + it.slot + '</div><div class="ex-name">' + it.opts[sel].n +
         (it.opts[sel].m ? '<span class="mach">MACHINE</span>' : '') + '</div>' +
         (sets ? '<div class="sets">' + sets + '</div>' : '') + '</div></div>' +
         '<div class="chips">';
    it.opts.forEach(function(o, oi) {
      h += '<button class="chip' + (oi===sel ? ' sel' : '') + '" onclick="pick(\'' + day.id + '\',' + i + ',' + oi + ')">' +
           (oi===0 ? 'Main: ' : 'Alt: ') + o.n + (o.m ? '<span class="mach">M</span>' : '') + '</button>';
    });
    h += '</div></div>';
  });
  if (day.id === "cardio") {
    h += '<div class="note">' + (her
      ? 'Keep it conversational. Monday is the harder day since legs are fresh; the rest are easy. If you are worn out, shorten it or skip it.'
      : 'Optional on a bulk. A couple of short sessions is plenty so it does not eat into your surplus.') + '</div>';
  } else {
    h += '<div class="note">' + (her
      ? 'Rest 2-3 min on the first lift, 60-90 sec on the rest. Add weight once you hit the top of the rep range on every set.'
      : 'Rest 2-3 min on the heavy first lifts, 60-90 sec on the rest. Add weight once you hit the top of the rep range on every set.') + '</div>';
  }
  h += '</div><button class="reset-all" onclick="resetAll()">Reset the whole week (' + (her ? 'Her' : 'Him') + ')</button>';
  document.getElementById("app").innerHTML = h;
}
load(); render();
</script>
</body>
</html>
